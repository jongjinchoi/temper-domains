name: Windows check

# Manual observation only: not part of CI / required and not release evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Windows check / observe
    runs-on: windows-latest
    timeout-minutes: 30
    # Keep checkout bytes identical to the other platforms; hashes are compared.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun ci
      - run: mkdir -p logs
        shell: bash
      # Observed steps use the default Windows shell, as users and the release build do:
      # under bash, Git's GNU tar takes precedence and reads C:\ as a remote host.
      # Each one continues on error so that later steps still run.
      - id: bun_test
        continue-on-error: true
        shell: pwsh
        run: |
          bun test *> logs/bun-test.log
          $code = $LASTEXITCODE
          Get-Content logs/bun-test.log
          exit $code
      - id: build
        continue-on-error: true
        shell: pwsh
        run: |
          bun run build:npm *> logs/build-npm.log
          $code = $LASTEXITCODE
          Get-Content logs/build-npm.log
          exit $code
      - id: node_cli
        continue-on-error: true
        shell: pwsh
        run: |
          node dist/npm/index.js --help *> logs/node-cli.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            node dist/npm/index.js extensions --categories *>> logs/node-cli.log
            $code = $LASTEXITCODE
          }
          Get-Content logs/node-cli.log
          exit $code
      - id: node_checks
        continue-on-error: true
        shell: pwsh
        run: |
          bun build tests/runtime/entry.ts --target=node --packages=external --outfile=dist/test-runtime/entry.js *> logs/node-checks.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            node --test tests/runtime/node-checks.mjs *>> logs/node-checks.log
            $code = $LASTEXITCODE
          }
          Get-Content logs/node-checks.log
          exit $code
      - id: limits
        continue-on-error: true
        shell: pwsh
        run: |
          node tests/limits/runner.mjs *> logs/limits.log
          $code = $LASTEXITCODE
          Get-Content logs/limits.log
          exit $code
      - id: transport
        continue-on-error: true
        shell: pwsh
        run: |
          node tests/transport/runner.mjs *> logs/transport.log
          $code = $LASTEXITCODE
          Get-Content logs/transport.log
          exit $code
      # Diagnostic output only; it does not count towards the observed result.
      - name: Record how lock and replace steps behave under contention
        continue-on-error: true
        shell: pwsh
        run: |
          try { "real-time protection enabled: $((Get-MpComputerStatus).RealTimeProtectionEnabled)" > logs/lock-probe.log }
          catch { "real-time protection status unavailable: $($_.Exception.Message)" > logs/lock-probe.log }
          node tests/limits/lock-probe.mjs *>> logs/lock-probe.log
          bun tests/limits/lock-probe.mjs *>> logs/lock-probe.log
          Get-Content logs/lock-probe.log
      - name: Summarize
        if: always()
        shell: bash
        env:
          OUTCOMES: "bun test=${{ steps.bun_test.outcome }} | build:npm=${{ steps.build.outcome }} | node CLI=${{ steps.node_cli.outcome }} | node checks=${{ steps.node_checks.outcome }} | limits=${{ steps.limits.outcome }} | transport=${{ steps.transport.outcome }}"
        run: |
          { echo "### Windows check"; echo "$OUTCOMES"; for f in logs/*.log; do echo; echo "#### $f (last 40 lines)"; echo '```'; tail -40 "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-check-logs
          path: logs
      # The run result reflects what was observed; nothing depends on it.
      - name: Report the observed result
        if: always()
        shell: bash
        env:
          FAILED: ${{ contains(steps.*.outcome, 'failure') }}
        run: test "$FAILED" = false

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.workflow == 'CI' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  root:
    name: ${{ github.workflow }} / root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "lts/*"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun ci
      - run: bun test
      - run: bun run typecheck
      - run: bun run docs:check
      - run: bun run build:npm
      - run: node tests/limits/runner.mjs

  web:
    name: ${{ github.workflow }} / web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "lts/*"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun ci
      - run: bun run web:typecheck
      - run: bun run web:build
        env:
          TEMPER_PUBLIC_BUILD: '1'
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: bash tests/browser/run.sh

  node-compatibility:
    name: ${{ github.workflow }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22.12.0", "lts/*"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun ci
      - run: bun run build:npm
      - run: node dist/npm/index.js --help
      - run: node dist/npm/index.js extensions --categories
      - run: bun build tests/runtime/entry.ts --target=node --packages=external --outfile=dist/test-runtime/entry.js
      - run: node --test tests/runtime/node-checks.mjs
      - run: python3 tests/helpers/tui-exit-check.py node dist/npm/index.js
      - run: node tests/transport/runner.mjs

  updater-compatibility:
    name: ${{ github.workflow }} / updater ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun ci
      - run: bun test src/update
      - run: bun run tests/update/runtime.ts
      - run: bun build tests/update/runtime.ts --target=node --packages=external --define 'PKG_VERSION="0.0.0"' --outfile=dist/test-runtime/updater.mjs
      - run: node dist/test-runtime/updater.mjs
      - name: Verify real terminal handoff (Unix)
        if: runner.os != 'Windows'
        run: |
          bun build tests/update/terminal.tsx --target=node --packages=external --outfile=dist/test-runtime/update-terminal.mjs
          python3 tests/update/terminal-check.py bun tests/update/terminal.tsx
          python3 tests/update/terminal-check.py node dist/test-runtime/update-terminal.mjs
          python3 tests/update/automatic-check.py bun
          python3 tests/update/startup-check.py bun src/index.ts
          bun run build:npm
          python3 tests/update/startup-check.py node dist/npm/index.js

  required:
    name: ${{ github.workflow }} / required
    if: always()
    needs: [root, web, node-compatibility, updater-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          ROOT: ${{ needs.root.result }}
          WEB: ${{ needs.web.result }}
          NODE: ${{ needs.node-compatibility.result }}
          UPDATER: ${{ needs.updater-compatibility.result }}
        run: |
          for result in "$ROOT" "$WEB" "$NODE" "$UPDATER"; do
            test "$result" = success || exit 1
          done

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to recover npm publication (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  TEMPER_PUBLIC_BUILD: '1'

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "lts/*"
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
            # Build the workflow commit so npm provenance names the actual source.
            # Recovery permits only workflow/documentation changes after the tag.
            git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- . \
              ':(exclude).github/workflows/release.yml' ':(exclude)docs/release.md'
          else
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
      - name: Require successful main CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun ci
      - run: mkdir -p dist && npm pack --pack-destination dist
      - run: bun tests/packaging/smoke.mjs npm dist/temper-domains-$(node -p 'require("./package.json").version').tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs
          path: |
            dist/temper-source-*.tar.gz
            dist/temper-domains-*.tgz
            dist/source-manifest.json

  source:
    permissions:
      contents: write
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: dist
      - name: Publish and verify corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            test "$GITHUB_EVENT_NAME" = push
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          else
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = false
          fi
          SOURCE_FILE="dist/temper-source-${GITHUB_SHA}.tar.gz"
          if [ "$(gh release view "$RELEASE_TAG" --json assets --jq ".assets | any(.name == \"${SOURCE_FILE#dist/}\")")" != true ]; then
            gh release upload "$RELEASE_TAG" "$SOURCE_FILE"
          fi
          curl --fail --location --retry 3 "https://github.com/jongjinchoi/temper-domains/releases/download/${RELEASE_TAG}/${SOURCE_FILE#dist/}" --output "$RUNNER_TEMP/temper-public-source.tar.gz"
          bun run scripts/verify-source-archive.ts dist/source-manifest.json "$RUNNER_TEMP/temper-public-source.tar.gz"

  build:
    if: github.event_name == 'push'
    needs: source
    # The public source archive is created on Linux; keep checkout bytes identical.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-latest
          - target: bun-darwin-x64
            os: macos-15-intel
          - target: bun-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
          - target: bun-windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun ci
      - name: Build binary
        run: |
          bun run build.ts ${{ matrix.target }}
          bun run scripts/source-package.ts ${{ matrix.target }}
      - name: Run the packaged binary on its target platform
        run: bun tests/packaging/smoke.mjs native ${{ matrix.target }} dist/temper-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: temper-${{ matrix.target }}
          path: dist/temper-${{ matrix.target }}.tar.gz

  release:
    permissions:
      contents: write
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: temper-*
          merge-multiple: true
      - name: Upload native archives without replacing published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for archive in dist/temper-*.tar.gz; do
            name="${archive#dist/}"
            if [ "$(gh release view "$RELEASE_TAG" --json assets --jq ".assets | any(.name == \"$name\")")" = true ]; then
              curl --fail --location --retry 3 "https://github.com/jongjinchoi/temper-domains/releases/download/$RELEASE_TAG/$name" --output "$RUNNER_TEMP/$name"
              # gzip timestamps can differ on a retry; compare the actual files.
              diff <(tar -tzf "$archive" | sort) <(tar -tzf "$RUNNER_TEMP/$name" | sort)
              while IFS= read -r member; do
                cmp <(tar -xOf "$archive" "$member") <(tar -xOf "$RUNNER_TEMP/$name" "$member")
              done < <(tar -tzf "$archive")
            else
              gh release upload "$RELEASE_TAG" "$archive"
            fi
          done

  npm:
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: dist
      - name: Check whether this exact npm artifact was already published
        id: published
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const file = `./dist/temper-domains-${pkg.version}.tgz`;
            const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
            if (response.status !== 404) {
              if (!response.ok) throw new Error(`Registry check failed: ${response.status}`);
              const remote = await response.json();
              const integrity = "sha512-" + createHash("sha512").update(readFileSync(file)).digest("base64");
              if (remote.dist.integrity !== integrity) throw new Error("This version already contains a different artifact; do not overwrite or republish it");
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status !== 404}\nfile=${file}\n`);
          '
      - run: npm publish "${{ steps.published.outputs.file }}" --access public
        if: steps.published.outputs.exists == 'false'

  homebrew:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jongjinchoi/homebrew-temper-domains
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        shell: bash
        working-directory: tap
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}
          bash ../release-source/scripts/update-homebrew.sh "$VERSION" \
            "https://github.com/jongjinchoi/temper-domains/releases/download/v${VERSION}" Formula/temper.rb
      - name: Commit and push
        working-directory: tap
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/temper.rb
          git diff --cached --quiet || (git commit -m "temper ${VERSION}" && git push)

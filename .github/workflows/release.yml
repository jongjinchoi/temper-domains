name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to recover npm publication (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
            # Build the workflow commit so npm provenance names the actual source.
            # Recovery permits only workflow/documentation changes after the tag.
            git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- . \
              ':(exclude).github/workflows/release.yml' ':(exclude)docs/release.md'
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun ci
      - run: bun test
      - run: bun run typecheck
      - run: bun run build:npm

  build:
    if: github.event_name == 'push'
    needs: verify
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-latest
          - target: bun-darwin-x64
            os: macos-latest
          - target: bun-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            os: ubuntu-latest
          - target: bun-windows-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun ci
      - name: Build binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} --minify --sourcemap --define PKG_VERSION="\"$VERSION\"" ./src/index.ts --outfile dist/temper
          cd dist
          if [ -f temper.exe ]; then
            tar -czf temper-${{ matrix.target }}.tar.gz temper.exe
          else
            tar -czf temper-${{ matrix.target }}.tar.gz temper
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: temper-${{ matrix.target }}
          path: dist/temper-${{ matrix.target }}.tar.gz

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/temper-*.tar.gz
          generate_release_notes: true

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun ci
      - run: bun run build:npm
      - run: npm publish --access public

  homebrew:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: jongjinchoi/homebrew-temper-domains
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update formula
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          BASE_URL="https://github.com/jongjinchoi/temper-domains/releases/download/v${VERSION}"

          SHA_DARWIN_ARM64=$(curl -sL "${BASE_URL}/temper-bun-darwin-arm64.tar.gz" | shasum -a 256 | awk '{print $1}')
          SHA_DARWIN_X64=$(curl -sL "${BASE_URL}/temper-bun-darwin-x64.tar.gz" | shasum -a 256 | awk '{print $1}')
          SHA_LINUX_X64=$(curl -sL "${BASE_URL}/temper-bun-linux-x64.tar.gz" | shasum -a 256 | awk '{print $1}')
          SHA_LINUX_ARM64=$(curl -sL "${BASE_URL}/temper-bun-linux-arm64.tar.gz" | shasum -a 256 | awk '{print $1}')

          cat > Formula/temper.rb << EOF
          class Temper < Formula
            desc "Never leave your terminal to find a domain"
            homepage "https://github.com/jongjinchoi/temper-domains"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/temper-bun-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${BASE_URL}/temper-bun-darwin-x64.tar.gz"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/temper-bun-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "${BASE_URL}/temper-bun-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "temper"
            end

            test do
              system "#{bin}/temper", "--version"
            end
          end
          EOF
      - name: Commit and push
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/temper.rb
          git diff --cached --quiet || (git commit -m "temper ${VERSION}" && git push)
